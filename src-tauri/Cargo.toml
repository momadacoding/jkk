[package]
name = "app"
version = "0.7.4"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Tauri 2.12 起的 MSRV
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# 2.7 起静态链接 VC 运行库改由 tauri.conf.json 的 build.windows.staticVCRuntime 决定、默认开：
# 安装包与以前一样是静态的（CLI 以前就设 STATIC_VCRUNTIME=true），变化只在裸 cargo build / test
# 现在也静态链接——测试都是在这个状态下跑通的
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 2.12 起 tauri-runtime-wry 依赖 tao 0.37：修掉收到 WM_ENDSESSION（MSI 升级时的
# Restart Manager、关机、注销）后在 tao runner 里 panic、退出码 101 的问题（tao issue 1310）
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
git2 = "0.20"
notify = "7"
tauri-plugin-dialog = "2.7.2"

# 系统级快捷键呼出主界面。只在 Rust 侧注册，不引入对应的 npm 包、不开 JS 权限
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
# 全局单例：再次启动时唤起已有窗口而不是多开。托盘、全局快捷键、session.json、
# settings.json 都按「一台机器一个进程」设计，多开会互相覆盖。只在 release 构建注册，见 lib.rs
tauri-plugin-single-instance = "2.4.5"

# svn 的 --xml 输出必须用真 parser 解析：`<wc-status` 与 `revision="…"` 不在同一行
# 且是 CRLF，行内正则**不报错、只返回空集**，于是「nodeRevs 单值」这条不变量会以
# 一种看起来通过了的方式被绕过（spec §6.6.4 陷阱三）。
#
# 选 roxmltree 而非 quick-xml：我们只读不写，DOM 查询能直接表达「取 <wc-status> 的
# revision 而不是内层 <commit> 的」，不必手写嵌套状态机——取错那一层正是 spec
# §6.6.4 陷阱二记录的永久误报。0.21 的依赖只有 memchr（已在树里），
# rust-version 1.60，低于本 crate 声明的 MSRV。
roxmltree = "0.21"

# 删 worktree 撞上「文件被占用」时，用 Restart Manager 查出到底是哪个进程占着。
# 这个 crate 本来就在依赖树里（tao → tauri），这里只是显式声明并打开需要的
# feature，不会新增下载。非 Windows 平台不引入。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_RestartManager",
  # TortoiseSVN 钩子：读写 HKCU\Software\TortoiseSVN\hooks（C1h 计划 Task 1）
  "Win32_System_Registry",
  # 钩子的 stderr 按线程 ANSI 代码页写，TortoiseSVN 按它解读（C1h 日志 H4）
  "Win32_Globalization",
] }

[dev-dependencies]
tempfile = "3.14"

# 机械护栏：防止以后的改动悄悄引入会让后端 panic 的写法。
# clippy 类只在 `cargo clippy` 时检查；测试代码的豁免见 clippy.toml 与各测试文件顶部。
[lints.rust]
# 不用 forbid（它不能被局部放开）：Restart Manager / 注册表 / 代码页转换三处
# Windows FFI 必须 unsafe，在那几个函数 / 模块上显式 #[allow] 并写明理由
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
