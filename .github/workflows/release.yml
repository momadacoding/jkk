# 打 tag 触发构建并发 Release。
#
# 这**不是** PR 门禁：本仓库没有 PR CI，push 和 pull_request 都不会跑这个 workflow。
# 合并前的验证仍然靠本地手工执行（见 AGENTS.md §5）。
#
# 手动跑（`workflow_dispatch`）时只构建、不发 Release，用来在真打 tag 之前
# 确认 CI 环境能把包编出来。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 默认只读。写权限只给真正要建 Release 的 publish job——
# 构建链上跑着依赖安装脚本、构建脚本和一串第三方 action，
# 没有任何理由让它们运行在能改仓库的权限边界里。
permissions:
  contents: read

# 同一个 tag 被重复推时不要并行跑两遍
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 所有 action 一律钉到完整 commit SHA。
#
# 关键理由不是「防止它们改仓库」——build job 只有 contents: read。
# 而是**这个 job 里的任何一个 action 都能改最终发出去的安装包**：
# 它们经手工作区和 artifact，而 publish job 会无条件把 artifact 发布出去。
# 可变 tag（@v4）随时可能被重新指向，`contents: read` 拦不住这条路径。
#
# 但要清楚这买到的是什么：构建期本来就有 257 个依赖的 build.rs 和 npm
# 生命周期脚本在跑，钉定 action 只是关掉其中一扇门，不等于产物可信。
#
# 刷新 SHA（没有 dependabot，需要手工）：
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq '.object.sha'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 不把凭据留在 .git/config 里。后面整条链（pnpm 生命周期脚本、
          # build.rs、第三方 action）都能读到那个文件
          persist-credentials: false

      # 放在最前面：任何一项对不上都要在几秒内失败，而不是等构建跑完十几分钟，
      # 更不能等到 Release 都建出来才发现装错了东西。
      #
      # 三道关：
      #   1. tag 名必须是严格 SemVer——顺带挡掉带引号/分号的畸形 ref
      #   2. tag 版本要和三个清单文件一致
      #   3. tag 指向的提交必须已经在 master 上
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          # **必须**经 env 传进来，绝不能把 ${{ }} 直接展开进脚本文本。
          # GitHub 的 ${{ }} 是在 shell 之前做文本替换的，而 git 允许 tag 名里
          # 出现单引号（实测 `v0.1.0';iwr$u;'` 是合法 tag），
          # 直接插进 '...' 会闭合字符串并执行后面的内容。
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = $env:REF_NAME

          if ($ref -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') {
            throw "tag 名不是合法的 SemVer：$ref"
          }
          $tag = $ref -replace '^v', ''

          $versions = [ordered]@{
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'src-tauri/Cargo.toml'      = ((Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value)
          }
          $versions.GetEnumerator() | ForEach-Object { "{0,-28} {1}" -f $_.Key, $_.Value }
          $bad = $versions.GetEnumerator() | Where-Object { $_.Value -ne $tag }
          if ($bad) {
            throw "tag 是 v$tag，但这些文件对不上：$(($bad | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ', ')"
          }

          # 提交来源：tag 打在功能分支或过期提交上，同样能构建成功，
          # 发出去的就是没经过 review 的代码，而且从安装包上看不出来。
          # 走 API 而不是 git merge-base——上面关掉了 persist-credentials，
          # 私有仓库的 git fetch 没有凭据可用。
          $cmp = gh api "repos/$env:REPO/compare/master...$env:SHA" --jq '.status'
          if ($LASTEXITCODE -ne 0) { throw "比对 master 失败" }
          # master 与该提交相同，或该提交在 master 之后（即已并入）才放行
          if ($cmp -notin @('identical', 'behind')) {
            throw "tag 指向的提交不在 master 上（与 master 比对结果：$cmp）。请先把改动合进 master 再打 tag。"
          }
          Write-Output "校验通过：$ref @ $env:SHA（相对 master：$cmp）"

      # secrets 不能用在 if 里，先把「在不在」映射成 output。
      # 只判存在性，值本身绝不写日志。
      - name: Detect signing certificate
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $has = -not [string]::IsNullOrEmpty($env:PFX_B64) -and -not [string]::IsNullOrEmpty($env:PFX_PASSWORD)
          "has_cert=$($has.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # MSRV 钉在 1.77.2（src-tauri/Cargo.toml 的 rust-version）。
      # 这里用 stable 而不是钉死 1.77.2：钉死的话本地能过、CI 也能过，
      # 但谁都不会发现依赖悄悄用了更新的语言特性。stable 编得过就说明真的能编。
      #
      # 钉的是 stable **分支的 commit**，冻的是 action 代码，不是 Rust 版本；
      # 装哪个 toolchain 由下面的 `toolchain: stable` 在运行时决定。
      # 这个输入必须显式给：`@stable` 能省略是因为那个分支的 action.yml 给了默认值，
      # 一旦按 SHA 引用就不能依赖它，而该输入是 required。
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 发版前把本地那套门槛在干净环境里再走一遍。
      # 没有 PR CI，这是唯一一次「不是在我这台机器上」的验证。
      - run: pnpm test
      - run: pnpm build
      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 第三方许可清单必须和锁文件一致。生成物进了仓库（安装包要带上它），
      # 所以这里只重算一遍看有没有漂移——依赖动了却忘了重新生成，会让
      # 分发出去的安装包缺少 MIT / Apache-2.0 要求保留的声明。
      - name: Check third-party notices are current
        run: node scripts/gen-notices.mjs --check

      # beforeBuildCommand 会再跑一次 pnpm build，这是 tauri.conf.json 里配好的，
      # 重复一次几秒钟，不值得为省它去动配置
      #
      # pfx 解码后即导入用户证书库并立刻删文件——证书文件在盘上的存活窗口
      # 压到这一步内部。密码全程只经 PowerShell 变量（SecureString），不进任何
      # 命令行（signtool /p、certutil 都会把密码暴露给进程列表）。
      - name: Import signing certificate
        if: steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $secure = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
          $imported = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          "CERT_THUMB=$($imported.Thumbprint)" >> $env:GITHUB_ENV

      - name: tauri build (signed)
        if: steps.cert.outputs.has_cert == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # signCommand 完全静态：脚本路径是 checkout 下的绝对路径，指纹由脚本
          # 自己从 CERT_THUMB 环境变量读。配置里零秘密。
          $cfg = @{
            bundle = @{ windows = @{ signCommand = @{
              cmd  = 'pwsh'
              args = @('-NoProfile', '-File', "$PWD/scripts/sign-windows.ps1", '-Target', '%1')
            } } }
          } | ConvertTo-Json -Depth 6 -Compress
          $cfgPath = Join-Path $env:RUNNER_TEMP 'tauri-sign.conf.json'
          [IO.File]::WriteAllText($cfgPath, $cfg)
          pnpm tauri build -c $cfgPath
          if ($LASTEXITCODE -ne 0) { throw 'tauri build (signed) 失败' }

      # 无证书路径必须与接线前逐字节一致
      - name: tauri build (unsigned)
        if: steps.cert.outputs.has_cert == 'false'
        run: pnpm tauri build

      # runner 是一次性 VM，但证书不该陪跑到 job 结束
      - name: Remove signing certificate
        if: ${{ always() && steps.cert.outputs.has_cert == 'true' }}
        shell: pwsh
        run: |
          Remove-Item "Cert:\CurrentUser\My\$env:CERT_THUMB" -Force -ErrorAction SilentlyContinue

      # 绿色版：原始 exe 本身就是完整应用，zip 起来直接发。
      # 打包发生在 build 之后——有证书时 zip 里的 exe 也是签过名的。
      - name: Pack portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = 'src-tauri/target/release/jkk.exe'
          if (-not (Test-Path $exe)) { throw "没找到 $exe" }

          $stage = Join-Path $env:RUNNER_TEMP 'portable-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $exe $stage
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $stage

          # 使用说明内联生成，不进 repo（避免双维护）；\r\n + BOM 是旧版记事本兼容
          $readme = @(
            'jkk 绿色版（免安装）'
            '===================='
            ''
            '解压后直接运行 jkk.exe 即可。'
            ''
            '* 本软件未做代码签名，首次运行 Windows 会弹 SmartScreen'
            '  「未知发布者」警告：点「更多信息」→「仍要运行」。'
            '* 若双击无反应或报错，说明系统缺少 WebView2 运行时'
            '  （Win11 和保持更新的 Win10 自带），请从微软官网安装：'
            '  https://developer.microsoft.com/microsoft-edge/webview2/'
            '* 第三方组件许可声明见 THIRD_PARTY_NOTICES.md。'
          ) -join "`r`n"
          [IO.File]::WriteAllText(
            (Join-Path $stage 'README-绿色版.txt'),
            $readme,
            [Text.UTF8Encoding]::new($true)
          )

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $zip = "artifacts/jkk_${version}_x64-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Collect installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $bundle = 'src-tauri/target/release/bundle'
          $found = Get-ChildItem $bundle -Recurse -Include *.exe, *.msi -ErrorAction SilentlyContinue
          if (-not $found) { throw "在 $bundle 下没找到任何 .exe/.msi 产物" }
          $found | ForEach-Object { Copy-Item $_.FullName artifacts/ }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jkk-windows
          path: artifacts/*

  # 拆成独立 job 的唯一目的：让 contents: write 只存在于这里。
  # 它不 checkout 代码、不跑构建，只把上一个 job 的产物挂上去。
  # 跑 ubuntu 而不是 windows：私有仓库的 Windows runner 按 2 倍分钟数计费，
  # 而这一步只是调一次 gh。
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jkk-windows
          path: artifacts

      # 发成 draft：产物传上去之后由人过目一眼再点发布。
      #
      # 三种状态分开处理，**不能只判断「存在与否」**：
      #   不存在      -> 建 draft
      #   存在且是 draft -> 复用并覆盖资产（修复上次传到一半的中间态）
      #   存在且已发布   -> 直接失败
      # 最后一种是关键：`--clobber` 会静默替换已经公开的安装包。
      # 加上 Rust 用的是 stable、同一 tag 重建结果本来就不保证一致，
      # 覆盖之后「同一个版本号对应不同的二进制」，审计和回滚都失去依据。
      #
      # 注意：这里同样不能把 ${{ github.ref_name }} 直接展开进脚本，理由见 build job。
      # 多行文本用单引号字符串——反引号在其中是字面量，不会被当成命令替换。
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes='安装包**未做代码签名**时，Windows 会弹 SmartScreen「未知发布者」警告。
          点「更多信息」→「仍要运行」即可。

          产物：
          - `*-setup.exe` —— NSIS 安装器
          - `*.msi` —— MSI 安装包
          - `*-portable.zip` —— 免安装绿色版（解压即用；缺 WebView2 运行时的旧系统
            需先装 https://developer.microsoft.com/microsoft-edge/webview2/ ）
          - `SHA256SUMS.txt` —— 上面文件的校验和

          第三方组件的许可声明见安装目录下的 THIRD_PARTY_NOTICES.md。'

          # 校验和随包发布，便于核对下载到的是不是这次构建的产物
          ( cd artifacts && sha256sum ./* > SHA256SUMS.txt )
          cat artifacts/SHA256SUMS.txt

          # `|| true` 不能少：release 不存在时 gh 返回非零，而这里开着 set -e
          state=$(gh release view "$REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          case "$state" in
            absent)
              gh release create "$REF_NAME" --title "$REF_NAME" --notes "$notes" --draft ;;
            true)
              echo "Release $REF_NAME 仍是 draft（上次可能传到一半），复用并覆盖资产" ;;
            false)
              echo "::error::Release $REF_NAME 已经发布，拒绝覆盖已公开的资产。"
              echo "::error::要重发请先手动删除该 Release，或改用新的版本号。"
              exit 1 ;;
            *)
              echo "::error::无法判断 Release $REF_NAME 的状态：$state"
              exit 1 ;;
          esac

          gh release upload "$REF_NAME" artifacts/* --clobber

          # 传完核对一遍：两种安装包和绿色 zip 都必须在，否则等于发了个残缺的 Release
          assets=$(gh release view "$REF_NAME" --json assets --jq '.assets[].name')
          echo "已上传的资产："
          echo "$assets"
          echo "$assets" | grep -q '\.msi$'         || { echo "::error::缺少 .msi 资产"; exit 1; }
          echo "$assets" | grep -q 'setup\.exe$'    || { echo "::error::缺少 setup.exe 资产"; exit 1; }
          echo "$assets" | grep -q 'portable\.zip$' || { echo "::error::缺少 portable zip 资产"; exit 1; }
          echo "$assets" | grep -q '^SHA256SUMS.txt$' || { echo "::error::缺少 SHA256SUMS.txt"; exit 1; }
